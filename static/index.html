<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>モニタリングGr工事予定表</title>
  <style>
    :root {
      --primary: #1e40af;
      --primary-light: #3b82f6;
      --primary-dark: #1e3a8a;
      --secondary: #0f766e;
      --accent: #f59e0b;
      --danger: #dc2626;
      --bg: #f0f4f8;
      --surface: #ffffff;
      --border: #e2e8f0;
      --text: #1e293b;
      --text-muted: #64748b;
      --shadow: 0 2px 8px rgba(0,0,0,0.08);
      --shadow-lg: 0 8px 24px rgba(0,0,0,0.12);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', 'Hiragino Sans', 'Yu Gothic UI', sans-serif; background: var(--bg); color: var(--text); font-size: 13px; min-height: 100vh; }

    /* ===== ヘッダー ===== */
    .header { background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 60%, var(--primary-light) 100%); color: #fff; padding: 0 20px; box-shadow: 0 2px 12px rgba(0,0,0,0.2); position: sticky; top: 0; z-index: 100; height: 56px; display: flex; align-items: center; gap: 16px; }
    .header-title { font-size: 18px; font-weight: 700; letter-spacing: 0.02em; flex: 1; }
    .header-title span { font-size: 12px; opacity: 0.75; font-weight: 400; margin-left: 8px; }
    .header-actions { display: flex; gap: 8px; align-items: center; }

    /* ===== ボタン ===== */
    .btn { display: inline-flex; align-items: center; gap: 5px; padding: 6px 14px; border-radius: 6px; border: none; cursor: pointer; font-size: 13px; font-weight: 500; transition: all 0.15s; white-space: nowrap; }
    .btn:hover { transform: translateY(-1px); }
    .btn-primary { background: var(--primary-light); color: #fff; }
    .btn-primary:hover { background: var(--primary); }
    .btn-success { background: var(--secondary); color: #fff; }
    .btn-success:hover { background: #0d6460; }
    .btn-warning { background: var(--accent); color: #fff; }
    .btn-warning:hover { background: #d97706; }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-danger:hover { background: #b91c1c; }
    .btn-ghost { background: rgba(255,255,255,0.15); color: #fff; border: 1px solid rgba(255,255,255,0.3); }
    .btn-ghost:hover { background: rgba(255,255,255,0.25); }
    .btn-outline { background: transparent; color: var(--primary-light); border: 1px solid var(--primary-light); }
    .btn-outline:hover { background: var(--primary-light); color: #fff; }
    .btn-sm { padding: 3px 8px; font-size: 11px; }
    .btn-icon { padding: 5px 8px; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    /* ===== ナビゲーション (月選択) ===== */
    .nav-bar { background: var(--surface); border-bottom: 1px solid var(--border); padding: 10px 20px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .nav-month-nav { display: flex; align-items: center; gap: 8px; }
    .nav-month-label { font-size: 20px; font-weight: 700; color: var(--primary); min-width: 140px; text-align: center; }
    .nav-jump { display: flex; gap: 6px; align-items: center; margin-left: auto; }
    .nav-jump select { padding: 5px 8px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; background: #fff; }
    .today-badge { background: var(--accent); color: #fff; padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 600; margin-left: 4px; }

    /* ===== メインレイアウト ===== */
    .main { padding: 16px 20px; }

    /* ===== スケジュールテーブル ===== */
    .table-container { background: var(--surface); border-radius: 10px; box-shadow: var(--shadow); overflow: hidden; margin-bottom: 20px; }
    .table-wrapper { overflow-x: auto; }
    table { border-collapse: collapse; min-width: 100%; }
    thead { position: sticky; top: 0; z-index: 10; }

    /* 曜日ヘッダー */
    th { background: #1e3a8a; color: #fff; padding: 0; font-weight: 600; font-size: 11px; border: 1px solid rgba(255,255,255,0.15); text-align: center; white-space: nowrap; }
    th.staff-col { background: #1e3a8a; min-width: 90px; width: 90px; font-size: 12px; padding: 8px 6px; position: sticky; left: 0; z-index: 20; }
    .th-day { min-width: 44px; width: 44px; }
    .th-day .day-num { font-size: 13px; font-weight: 700; display: block; padding: 4px 2px 0; }
    .th-day .day-wd { font-size: 10px; opacity: 0.8; display: block; padding: 0 2px 4px; }
    th.sat, th.sun, th.hol { background: #9f1239; }

    /* 担当者行 */
    tr { border-bottom: 1px solid var(--border); }
    tr:hover { background: #f8fafc; }
    tr:last-child { border-bottom: none; }
    td { padding: 4px; border: 1px solid var(--border); vertical-align: top; min-height: 40px; height: 44px; }
    td.staff-name { background: #f1f5f9; font-weight: 600; font-size: 12px; padding: 6px 8px; position: sticky; left: 0; z-index: 5; vertical-align: middle; border-right: 2px solid #cbd5e1; white-space: nowrap; min-width: 90px; width: 90px; }
    td.day-cell { min-width: 44px; width: 44px; cursor: pointer; position: relative; padding: 2px; }
    td.day-cell:hover { background: #eff6ff; }
    td.sat-cell, td.sun-cell, td.hol-cell { background: #fff1f2; }

    /* セル内の予定タグ（単独日） */
    .entry-tag { display: block; background: #3b82f6; color: #fff; border-radius: 4px; padding: 2px 4px; font-size: 10px; line-height: 1.3; margin-bottom: 2px; cursor: pointer; position: relative; word-break: break-all; }
    .entry-tag:hover { opacity: 0.85; }
    .entry-tag.rest { background: #94a3b8; }
    .entry-tag.meeting { background: #7c3aed; }
    .entry-tag.color-red { background: #ef4444; }
    .entry-tag.color-green { background: #10b981; }
    .entry-tag.color-orange { background: #f97316; }
    .entry-tag.color-purple { background: #8b5cf6; }
    .entry-tag.color-teal { background: #14b8a6; }
    .entry-tag.color-pink { background: #ec4899; }
    .entry-tag.color-gray { background: #6b7280; }
    /* 薄い色3色 */
    .entry-tag.color-light-blue { background: #bfdbfe; color: #1e40af; }
    .entry-tag.color-light-green { background: #bbf7d0; color: #166534; }
    .entry-tag.color-light-yellow { background: #fef08a; color: #854d0e; }
    /* リマインドアイコン */
    .entry-tag .remind-dot { display:inline-block; width:6px; height:6px; background:#fff; border-radius:50%; margin-right:2px; vertical-align:middle; opacity:0.85; }

    /* ===== 連続バー表示（span-bar） ===== */
    /* バー共通：セルいっぱいに張り付く横長バー */
    .span-bar {
      display: block;
      height: 22px;
      line-height: 22px;
      font-size: 10px;
      font-weight: 600;
      color: #fff;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      margin-bottom: 2px;
      /* セル左右のpaddingを打ち消してセルいっぱいに広げる */
      margin-left: -2px;
      margin-right: -2px;
    }
    .span-bar:hover { opacity: 0.85; }
    .span-bar .remind-dot { display:inline-block; width:6px; height:6px; background:#fff; border-radius:50%; margin-right:2px; vertical-align:middle; opacity:0.85; }
    /* 開始セル：左丸、右はまっすぐ（次のセルにつながる） */
    .span-bar.bar-start {
      border-radius: 11px 0 0 11px;
      padding-left: 10px;
      padding-right: 2px;
      margin-right: 0;  /* 右端をぴったり */
    }
    /* 中間セル：両端まっすぐ（テキスト非表示、色帯のみ） */
    .span-bar.bar-mid {
      border-radius: 0;
      padding: 0;
      margin-left: 0;
      margin-right: 0;
      color: transparent; /* テキスト非表示 */
    }
    /* 終端セル：左まっすぐ、右丸 */
    .span-bar.bar-end {
      border-radius: 0 11px 11px 0;
      padding-right: 6px;
      margin-left: 0;
      color: transparent; /* テキスト非表示 */
    }
    /* 単独日バー（soloは丸角タグと同じ見た目） */
    .span-bar.bar-solo {
      border-radius: 4px;
      padding: 2px 6px;
      margin-left: -2px;
      margin-right: -2px;
      color: #fff;
    }
    /* 薄い色のバーは文字色を暗く */
    .span-bar.bar-light { color: #1e293b !important; }
    .span-bar.bar-light .remind-dot { background: #1e293b; }
    /* バーセルはクリック可能だがaddボタンは非表示 */
    td.day-cell.has-bar { padding: 2px 0; }
    td.day-cell.bar-cont { cursor: default; }  /* 中間・終端は+ボタン不要 */
    td.day-cell.bar-cont .add-btn-cell { display: none !important; }

    .add-btn-cell { display: flex; align-items: center; justify-content: center; height: 100%; color: #cbd5e1; font-size: 16px; opacity: 0; }
    td.day-cell:hover .add-btn-cell { opacity: 1; color: var(--primary-light); }

    /* グループ区切り */
    tr.group-header td { background: #e2e8f0; font-weight: 700; color: var(--text-muted); font-size: 11px; padding: 2px 8px; height: 20px; border-bottom: 1px solid #cbd5e1; }

    /* ===== サイドパネル (担当者管理) ===== */
    .layout { display: flex; gap: 16px; }
    .schedule-area { flex: 1; min-width: 0; }
    .side-panel { width: 220px; flex-shrink: 0; }
    .panel-card { background: var(--surface); border-radius: 10px; box-shadow: var(--shadow); padding: 14px; margin-bottom: 14px; }
    .panel-title { font-weight: 700; font-size: 13px; color: var(--primary); margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
    .staff-list-item { display: flex; align-items: center; gap: 6px; padding: 5px 6px; border-radius: 6px; margin-bottom: 2px; cursor: grab; }
    .staff-list-item:hover { background: #f1f5f9; }
    .staff-list-item .staff-avatar { width: 26px; height: 26px; border-radius: 50%; background: var(--primary-light); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; flex-shrink: 0; }
    .staff-list-item .staff-label { flex: 1; font-size: 12px; font-weight: 500; }
    .staff-list-item .del-btn { opacity: 0; background: none; border: none; color: #ef4444; cursor: pointer; font-size: 14px; padding: 0 2px; }
    .staff-list-item:hover .del-btn { opacity: 1; }

    /* ===== モーダル ===== */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 200; display: flex; align-items: center; justify-content: center; padding: 16px; }
    .modal-overlay.hidden { display: none; }
    .modal { background: var(--surface); border-radius: 14px; box-shadow: var(--shadow-lg); width: 100%; max-width: 440px; overflow: hidden; animation: slideUp 0.2s ease; }
    @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .modal-header { background: linear-gradient(135deg, var(--primary-dark), var(--primary)); color: #fff; padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; }
    .modal-title { font-size: 15px; font-weight: 700; }
    .modal-close { background: none; border: none; color: #fff; font-size: 20px; cursor: pointer; opacity: 0.8; line-height: 1; padding: 0 4px; }
    .modal-close:hover { opacity: 1; }
    .modal-body { padding: 20px; }
    .modal-footer { padding: 14px 20px; background: #f8fafc; display: flex; gap: 8px; justify-content: flex-end; border-top: 1px solid var(--border); }

    /* ===== フォーム ===== */
    .form-group { margin-bottom: 14px; }
    label { display: block; font-weight: 600; font-size: 12px; color: var(--text-muted); margin-bottom: 4px; }
    input[type=text], input[type=number], select, textarea { width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 7px; font-size: 13px; font-family: inherit; transition: border-color 0.15s; background: #fff; }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--primary-light); box-shadow: 0 0 0 3px rgba(59,130,246,0.15); }
    textarea { resize: vertical; min-height: 70px; }

    /* カラー選択 */
    .color-picker { display: flex; gap: 8px; flex-wrap: wrap; }
    .color-swatch { width: 28px; height: 28px; border-radius: 50%; cursor: pointer; border: 3px solid transparent; transition: transform 0.1s; }
    .color-swatch:hover, .color-swatch.selected { border-color: var(--text); transform: scale(1.2); }

    /* ===== 凡例 & フィルターパネル ===== */
    .legend { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; padding: 10px 14px; background: var(--surface); border-radius: 8px; box-shadow: var(--shadow); margin-bottom: 12px; }
    .legend-item { display: flex; align-items: center; gap: 4px; font-size: 11px; }
    .legend-dot { width: 12px; height: 12px; border-radius: 3px; }
    /* フィルターチェック */
    .filter-sep { width: 1px; background: var(--border); height: 18px; margin: 0 4px; }
    .filter-label { font-size: 11px; font-weight: 700; color: var(--text-muted); white-space: nowrap; }
    .filter-check-item {
      display: inline-flex; align-items: center; gap: 5px; font-size: 11px;
      padding: 3px 8px; border-radius: 20px; cursor: pointer; user-select: none;
      border: 1.5px solid transparent; transition: all 0.15s;
    }
    /* チェックボックス自体は見た目を消すが、クリックイベントは生かす */
    .filter-check-item input[type=checkbox] {
      position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;
    }
    /* ON 状態 */
    .filter-check-item.active-jp  { background:#fff1f2; border-color:#9f1239; color:#9f1239; }
    .filter-check-item.active-cn  { background:#fff7ed; border-color:#c2410c; color:#c2410c; }
    .filter-check-item.active-kr  { background:#f0fdfa; border-color:#0f766e; color:#0f766e; }
    .filter-check-item.active-wkd { background:#eff6ff; border-color:#3b82f6; color:#1e40af; }
    /* OFF 状態（チェックなし） */
    .filter-check-item:not(.active-jp):not(.active-cn):not(.active-kr):not(.active-wkd) {
      color: var(--text-muted); border-color: var(--border); background: #f8fafc;
    }
    /* 非表示列 */
    .col-hidden { display: none !important; }

    /* ===== ローディング/空 ===== */
    .loading { text-align: center; padding: 40px; color: var(--text-muted); font-size: 14px; }
    .spinner { display: inline-block; width: 28px; height: 28px; border: 3px solid #e2e8f0; border-top-color: var(--primary-light); border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 8px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ===== トースト ===== */
    .toast-container { position: fixed; bottom: 24px; right: 24px; z-index: 300; display: flex; flex-direction: column; gap: 8px; }
    .toast { background: #1e293b; color: #fff; padding: 10px 16px; border-radius: 8px; font-size: 13px; box-shadow: var(--shadow-lg); animation: toastIn 0.3s ease; display: flex; align-items: center; gap: 8px; }
    .toast.success { border-left: 3px solid #10b981; }
    .toast.error { border-left: 3px solid #ef4444; }
    @keyframes toastIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

    /* ===== レスポンシブ ===== */
    @media (max-width: 768px) {
      .side-panel { display: none; }
      .nav-jump { display: none; }
      .header-title span { display: none; }
    }

    /* ===== 印刷 ===== */
    @media print {
      .header, .nav-bar, .side-panel, .legend { display: none !important; }
      .main { padding: 0; }
      .table-container { box-shadow: none; }
      th { background: #334155 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .entry-tag { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }

    /* ===== ドラッグ&ドロップ ===== */
    .dragging { opacity: 0.35; transform: scale(0.96); cursor: grabbing; }
    .drag-over { background: #dbeafe !important; outline: 2px dashed #3b82f6; outline-offset: -2px; }
    .entry-tag[draggable="true"], .span-bar[draggable="true"] { cursor: grab; }
    .entry-tag[draggable="true"]:active, .span-bar[draggable="true"]:active { cursor: grabbing; }

    /* ===== 今日強調 ===== */
    th.today-col { background: #065f46 !important; }
    td.today-col { background: #ecfdf5 !important; }

    /* ===== 中国祝日（橙系） ===== */
    th.cn-hol { background: #c2410c !important; }        /* 濃いオレンジ赤 */
    td.cn-hol-cell { background: #fff7ed !important; }   /* 薄いオレンジ */

    /* ===== 韓国祝日（青緑系） ===== */
    th.kr-hol { background: #0f766e !important; }        /* ティール */
    td.kr-hol-cell { background: #f0fdfa !important; }   /* 薄いティール */

    /* ===== ヘッダー内の国旗ラベル ===== */
    .th-country { display: flex; gap: 2px; justify-content: center; padding: 0 1px 2px; flex-wrap: wrap; }
    .th-flag { font-size: 9px; background: rgba(255,255,255,0.25); border-radius: 3px; padding: 0px 3px; line-height: 1.4; white-space: nowrap; }

    /* ===== リマインドバナー ===== */
    .remind-banner { background: linear-gradient(90deg, #fef3c7, #fffbeb); border-left: 4px solid #f59e0b; border-radius: 8px; padding: 10px 14px; margin-bottom: 12px; display: flex; align-items: flex-start; gap: 10px; }
    .remind-banner .bell { font-size: 20px; flex-shrink: 0; margin-top: 1px; }
    .remind-banner-title { font-weight: 700; font-size: 13px; color: #92400e; margin-bottom: 4px; }
    .remind-banner-list { display: flex; flex-direction: column; gap: 3px; }
    .remind-banner-item { font-size: 12px; color: #78350f; display: flex; align-items: center; gap: 6px; }
    .remind-banner-item .badge { background: #f59e0b; color: #fff; font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 10px; white-space: nowrap; }
    .remind-banner-item .badge.today { background: #dc2626; }
    .remind-banner-item .badge.soon { background: #d97706; }

    /* ===== リマインドモーダル ===== */
    .remind-list-item { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 6px; background: #fffbeb; }
    .remind-list-item .ri-info { flex: 1; font-size: 12px; }
    .remind-list-item .ri-days { font-weight: 700; color: #d97706; font-size: 13px; white-space: nowrap; }
    .remind-list-item .ri-del { background: none; border: none; color: #ef4444; cursor: pointer; font-size: 16px; padding: 0 2px; opacity: 0.6; }
    .remind-list-item .ri-del:hover { opacity: 1; }
    .remind-add-row { display: flex; gap: 6px; align-items: center; margin-top: 8px; flex-wrap: wrap; }
    .remind-add-row select, .remind-add-row input { padding: 6px 8px; border: 1px solid var(--border); border-radius: 6px; font-size: 12px; font-family: inherit; }
    .remind-add-row input[type=number] { width: 70px; }
    .remind-add-row input[type=text] { flex: 1; min-width: 120px; }

    /* ===== 検索バー ===== */
    .search-bar { display: flex; gap: 8px; align-items: center; }
    .search-input { padding: 5px 10px; border: 1px solid var(--border); border-radius: 20px; font-size: 12px; width: 180px; }
    .search-input:focus { outline: none; border-color: var(--primary-light); }
    .highlight { background: #fef08a !important; }
  </style>
</head>
<body>

<!-- ===== ヘッダー ===== -->
<header class="header">
  <div class="header-title">
    モニタリングGr 工事予定表
  </div>
  <div class="header-actions">
    <div class="search-bar">
      <input type="text" class="search-input" id="searchInput" placeholder="担当者・工事名検索">
    </div>
    <button class="btn btn-ghost" id="remindBellBtn" onclick="openRemindListModal()" title="リマインド一覧">🔔 <span id="remindBadge" style="display:none; background:#ef4444; color:#fff; font-size:10px; font-weight:700; padding:1px 5px; border-radius:10px; margin-left:2px;"></span></button>
    <button class="btn btn-ghost" onclick="openAddModal()">＋ 予定追加</button>
    <button class="btn btn-ghost" onclick="window.print()">印刷</button>
  </div>
</header>

<!-- ===== ナビゲーション ===== -->
<div class="nav-bar">
  <div class="nav-month-nav">
    <button class="btn btn-outline btn-icon" onclick="changeMonth(-1)" title="前月">◀</button>
    <div class="nav-month-label" id="monthLabel">読み込み中...</div>
    <button class="btn btn-outline btn-icon" onclick="changeMonth(1)" title="翌月">▶</button>
  </div>
  <button class="btn btn-outline btn-sm" onclick="goToday()">今月</button>

  <div class="nav-jump" style="margin-left:auto; display:flex; gap:6px; align-items:center;">
    <span style="font-size:12px;color:var(--text-muted);">年月:</span>
    <select id="jumpYear" onchange="jumpToMonth()" style="padding:4px 6px;border:1px solid var(--border);border-radius:6px;font-size:12px;"></select>
    <select id="jumpMonth" onchange="jumpToMonth()" style="padding:4px 6px;border:1px solid var(--border);border-radius:6px;font-size:12px;">
      <option value="1">1月</option><option value="2">2月</option><option value="3">3月</option>
      <option value="4">4月</option><option value="5">5月</option><option value="6">6月</option>
      <option value="7">7月</option><option value="8">8月</option><option value="9">9月</option>
      <option value="10">10月</option><option value="11">11月</option><option value="12">12月</option>
    </select>
  </div>
</div>

<!-- ===== メイン ===== -->
<div class="main">

<script>
// ===== グローバル状態 =====
let currentYear = new Date().getFullYear();
let currentMonth = new Date().getMonth() + 1;
let scheduleData = null;
let editingId = null;
let selectedColor = '#3b82f6';
let searchQuery = '';
let allMonths = [];
let refreshTimer = null;
let remindingScheduleId = null;   // リマインド設定対象のスケジュールID

// ===== 表示フィルター状態 =====
const displayFilter = { wkd: true, jp: true, cn: true, kr: true };

// ===== D&D 状態 =====
let dragState = null; // { id, staff, year, month, day }

// ===== フィルター切替 =====
// cb = チェックボックス要素（onchange から渡される）
function toggleFilter(key, cb) {
  displayFilter[key] = cb.checked;   // checkboxのchecked状態を正とする
  const labelId = `filter${key.charAt(0).toUpperCase()+key.slice(1)}Label`;
  const label   = document.getElementById(labelId);
  const activeClass = { wkd:'active-wkd', jp:'active-jp', cn:'active-cn', kr:'active-kr' }[key];
  if (displayFilter[key]) {
    label.classList.add(activeClass);
  } else {
    label.classList.remove(activeClass);
  }
  applyColumnFilter();
}

// ===== テーブル列にフィルターを適用（DOMへ直接操作で再描画不要） =====
function applyColumnFilter() {
  const table = document.querySelector('#scheduleTable table');
  if (!table) return;

  // th / td に data-day-type 属性をつけてある → それで判断
  const allThs = table.querySelectorAll('th[data-dtype]');
  const allTds = table.querySelectorAll('td[data-dtype]');

  function shouldHide(dtype) {
    if (dtype === 'sat' || dtype === 'sun') return !displayFilter.wkd;
    if (dtype === 'jp')  return !displayFilter.jp;
    if (dtype === 'cn')  return !displayFilter.cn;
    if (dtype === 'kr')  return !displayFilter.kr;
    return false;
  }

  for (const el of [...allThs, ...allTds]) {
    const dtype = el.getAttribute('data-dtype');
    if (shouldHide(dtype)) {
      el.classList.add('col-hidden');
    } else {
      el.classList.remove('col-hidden');
    }
  }
}

// ===== API =====
const API = {
  async getSchedule(year, month) {
    const r = await fetch(`/api/schedule?year=${year}&month=${month}`);
    return r.json();
  },
  async createSchedule(data) {
    const r = await fetch('/api/schedule', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify(data)
    });
    return r.json();
  },
  async updateSchedule(id, data) {
    const r = await fetch(`/api/schedule/${id}`, {
      method: 'PUT', headers: {'Content-Type':'application/json'},
      body: JSON.stringify(data)
    });
    return r.json();
  },
  async deleteSchedule(id) {
    const r = await fetch(`/api/schedule/${id}`, { method: 'DELETE' });
    return r.json();
  },
  async getStaff() {
    const r = await fetch('/api/staff');
    return r.json();
  },
  async addStaff(name) {
    const r = await fetch('/api/staff', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({name})
    });
    if (!r.ok) throw new Error(await r.text());
    return r.json();
  },
  async deleteStaff(name) {
    const r = await fetch(`/api/staff/${encodeURIComponent(name)}`, { method: 'DELETE' });
    return r.json();
  },
  async getMonths() {
    const r = await fetch('/api/months');
    return r.json();
  },
  async getReminders() {
    const r = await fetch('/api/reminders');
    return r.json();
  },
  async createReminder(data) {
    const r = await fetch('/api/reminders', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify(data)
    });
    if (!r.ok) throw new Error(await r.text());
    return r.json();
  },
  async deleteReminder(id) {
    const r = await fetch(`/api/reminders/${id}`, { method: 'DELETE' });
    return r.json();
  }
};

// ===== 初期化 =====
async function init() {
  try {
    const months = await API.getMonths();
    allMonths = months.months || [];
    buildJumpDropdown();
    // データがある最新月を初期表示にする
    if (allMonths.length > 0) {
      const latest = allMonths[allMonths.length - 1];
      currentYear = latest.year;
      currentMonth = latest.month;
    }
  } catch (e) {}
  await loadSchedule();
  await checkReminders();
  setInterval(autoRefresh, 30000); // 30秒ごと自動更新
}

async function autoRefresh() {
  try {
    const data = await API.getSchedule(currentYear, currentMonth);
    scheduleData = data;
    renderTable();
    renderSummary();
  } catch (e) {}
}

// ===== カレンダー読み込み =====
async function loadSchedule() {
  document.getElementById('scheduleTable').innerHTML = `<div class="loading"><div class="spinner"></div><div>読み込み中...</div></div>`;
  try {
    scheduleData = await API.getSchedule(currentYear, currentMonth);
    updateMonthLabel();
    renderTable();
    renderStaffPanel();
    renderSummary();
  } catch (e) {
    document.getElementById('scheduleTable').innerHTML = `<div class="loading" style="color:#ef4444;">読み込みエラー: ${e.message}</div>`;
  }
}

// ===== 月ラベル更新 =====
function updateMonthLabel() {
  const today = new Date();
  const isToday = today.getFullYear() === currentYear && today.getMonth()+1 === currentMonth;
  document.getElementById('monthLabel').innerHTML =
    `${currentYear}年 ${currentMonth}月` +
    (isToday ? ' <span class="today-badge">今月</span>' : '');
  document.getElementById('jumpYear').value = currentYear;
  document.getElementById('jumpMonth').value = currentMonth;
}

// リマインド設定済みスケジュールIDセット（表示用）
let remindMap = {};  // schedule_id -> true

// ===== スパン（連続バー）グループ計算 =====
// 同一staff・content・colorの連続日エントリをグループ化する
// 戻り値: spanInfo[staff][day] = { entries: [...], spans: [{id, pos:'start'|'mid'|'end'|'solo', color, content, groupKey},...] }
function buildSpanInfo(schedules, days) {
  // staff -> day -> entries
  const entryMap = {};
  for (const s of schedules) {
    if (!entryMap[s.staff]) entryMap[s.staff] = {};
    if (!entryMap[s.staff][s.day]) entryMap[s.staff][s.day] = [];
    entryMap[s.staff][s.day].push(s);
  }

  // staff -> day -> spanItems[]
  // spanItem: { id, pos:'start'|'mid'|'end'|'solo', color, content, lightColor }
  const spanInfo = {};

  const dayNums = days.map(d => d.day);

  for (const staffName of Object.keys(entryMap)) {
    spanInfo[staffName] = {};

    // その担当者の全エントリを「content+color」でグループ化し連続性チェック
    const allEntries = [];
    for (const day of dayNums) {
      for (const e of (entryMap[staffName][day] || [])) {
        allEntries.push({ ...e, day: Number(e.day) });
      }
    }
    // 処理済みIDセット
    const processed = new Set();
    const LIGHT = ['#bfdbfe','#bbf7d0','#fef08a'];

    for (const entry of allEntries) {
      if (processed.has(entry.id)) continue;
      const key = entry.content + '|' + (entry.color || '#3b82f6');
      // 同じkey・連続日のエントリを前後にたどって収集
      const group = [entry];
      processed.add(entry.id);
      // 前後に連続日があるか探索（dayNums内の順序で）
      const dayIdx = dayNums.indexOf(entry.day);
      // 後方探索
      for (let i = dayIdx + 1; i < dayNums.length; i++) {
        const nextDay = dayNums[i];
        if (nextDay !== dayNums[i-1] + 1) break; // 日付が飛んだら終了
        const match = (entryMap[staffName][nextDay] || []).find(
          e2 => !processed.has(e2.id) && (e2.content + '|' + (e2.color || '#3b82f6')) === key
        );
        if (!match) break;
        group.push({ ...match, day: Number(match.day) });
        processed.add(match.id);
      }

      const lightColor = LIGHT.includes(entry.color || '#3b82f6');

      // グループ全体の {id, day} リスト（D&D で全件まとめて移動するために使う）
      const groupIds = group.map(g => ({ id: g.id, day: g.day }));

      if (group.length === 1) {
        // 単独
        const d = group[0].day;
        if (!spanInfo[staffName][d]) spanInfo[staffName][d] = [];
        spanInfo[staffName][d].push({ id: group[0].id, pos: 'solo', color: entry.color || '#3b82f6', content: entry.content, lightColor, groupIds });
      } else {
        // 連続グループ
        for (let gi = 0; gi < group.length; gi++) {
          const g = group[gi];
          const pos = gi === 0 ? 'start' : gi === group.length - 1 ? 'end' : 'mid';
          if (!spanInfo[staffName][g.day]) spanInfo[staffName][g.day] = [];
          spanInfo[staffName][g.day].push({ id: g.id, pos, color: entry.color || '#3b82f6', content: entry.content, lightColor, groupIds });
        }
      }
    }
  }
  return { spanInfo, entryMap };
}

// ===== テーブル描画 =====
function renderTable() {
  if (!scheduleData) return;
  const { days, schedules, staff } = scheduleData;
  const today = new Date();
  const todayDay = (today.getFullYear() === currentYear && today.getMonth()+1 === currentMonth) ? today.getDate() : -1;

  // スパン情報を事前計算
  const { spanInfo, entryMap } = buildSpanInfo(schedules, days);

  let html = '<table>';

  // ヘッダー行
  html += '<thead><tr>';
  html += `<th class="staff-col">担当者</th>`;
  for (const d of days) {
      // 日本の土日祝
      const isJpRed = d.weekday === '土' || d.weekday === '日' || d.is_holiday;
      const jpCls = isJpRed ? (d.is_holiday && d.weekday !== '土' && d.weekday !== '日' ? 'hol' : d.weekday === '土' ? 'sat' : 'sun') : '';
      // 中国・韓国祝日（日本の土日祝でない平日でも独立して色付け）
      const cnCls = (!isJpRed && d.is_cn_holiday) ? 'cn-hol' : '';
      const krCls = (!isJpRed && !d.is_cn_holiday && d.is_kr_holiday) ? 'kr-hol' : '';
      // 中国・韓国両方ある日は中国優先
      const todayCls = d.day === todayDay ? 'today-col' : '';
      const thCls = [jpCls || cnCls || krCls, todayCls].filter(Boolean).join(' ');

      // 曜日ラベル
      const wdLabel = d.is_holiday ? '祝' : d.weekday;

      // ツールチップ：日本・中国・韓国の祝日名を全部まとめる
      const tips = [];
      if (d.holiday_name) tips.push(d.holiday_name);
      if (d.is_cn_holiday) tips.push(d.cn_holiday_name);
      if (d.is_kr_holiday) tips.push(d.kr_holiday_name);
      const titleAttr = tips.length ? ` title="${tips.join(' / ')}"` : '';

      // 国旗バッジ（中韓祝日がある日に小さく表示）
      let flagHtml = '';
      if (d.is_cn_holiday || d.is_kr_holiday) {
        flagHtml = '<div class="th-country">';
        if (d.is_cn_holiday) flagHtml += `<span class="th-flag">🇨🇳</span>`;
        if (d.is_kr_holiday) flagHtml += `<span class="th-flag">🇰🇷</span>`;
        flagHtml += '</div>';
      }

      // data-dtype: フィルター用（sat/sun/jp/cn/kr/normal）
      let dtype = 'normal';
      if (d.weekday === '土') dtype = 'sat';
      else if (d.weekday === '日') dtype = 'sun';
      else if (d.is_holiday) dtype = 'jp';
      else if (d.is_cn_holiday) dtype = 'cn';
      else if (d.is_kr_holiday) dtype = 'kr';

      html += `<th class="th-day ${thCls}" data-day="${d.day}" data-dtype="${dtype}"${titleAttr}><span class="day-num">${d.day}</span><span class="day-wd">${wdLabel}</span>${flagHtml}</th>`;
  }
  html += '</tr></thead>';

  // 担当者行
  html += '<tbody>';
  const staffList = staff || [];
  const query = searchQuery.toLowerCase();

  for (const staffName of staffList) {
    const staffMatch = !query || staffName.toLowerCase().includes(query);
    const staffEntries = entryMap[staffName] || {};
    const staffSpans  = spanInfo[staffName]  || {};

    // 検索時: その担当者に該当エントリがあれば表示
    let hasMatch = staffMatch;
    if (query && !staffMatch) {
      for (const dayEntries of Object.values(staffEntries)) {
        for (const e of dayEntries) {
          if (e.content.toLowerCase().includes(query)) { hasMatch = true; break; }
        }
        if (hasMatch) break;
      }
    }
    if (!hasMatch) continue;

    html += '<tr>';
    html += `<td class="staff-name" title="${staffName}">${staffName}</td>`;

    for (const d of days) {
      const isJpRed2 = d.weekday === '土' || d.weekday === '日' || d.is_holiday;
      const isToday2 = d.day === todayDay;
      // セル色優先順: 今日 > 日本土日祝（赤） > 中国祝日（橙） > 韓国祝日（緑）
      let cellColorCls = '';
      if (isJpRed2) cellColorCls = d.weekday === '土' ? 'sat-cell' : 'sun-cell';
      else if (d.is_cn_holiday) cellColorCls = 'cn-hol-cell';
      else if (d.is_kr_holiday) cellColorCls = 'kr-hol-cell';

      const daySpans   = staffSpans[d.day]   || [];
      const dayEntries = staffEntries[d.day]  || [];
      const hasBars    = daySpans.length > 0;
      const isCont = hasBars && daySpans.every(s => s.pos === 'mid' || s.pos === 'end');

      // data-dtype (フィルター用)
      let tdDtype = 'normal';
      if (d.weekday === '土') tdDtype = 'sat';
      else if (d.weekday === '日') tdDtype = 'sun';
      else if (d.is_holiday) tdDtype = 'jp';
      else if (d.is_cn_holiday) tdDtype = 'cn';
      else if (d.is_kr_holiday) tdDtype = 'kr';

      const cellCls = [
        'day-cell',
        cellColorCls,
        isToday2 ? 'today-col' : '',
        hasBars ? 'has-bar' : '',
        isCont  ? 'bar-cont' : ''
      ].filter(Boolean).join(' ');

      const clickHandler = isCont ? '' : `onclick="cellClick('${staffName}', ${d.day}, event)"`;
      // D&D: セルを drop ターゲットにする
      html += `<td class="${cellCls}" ${clickHandler}`
            + ` data-staff="${staffName}" data-day="${d.day}" data-dtype="${tdDtype}"`
            + ` ondragover="onCellDragOver(event)" ondragleave="onCellDragLeave(event)" ondrop="onCellDrop(event,'${staffName}',${d.day})">`;

      if (hasBars) {
        // ===== バー表示 =====
        for (const sp of daySpans) {
          const highlight = query && sp.content.toLowerCase().includes(query) ? 'highlight' : '';
          const lightCls  = sp.lightColor ? 'bar-light' : '';
          const textColor = sp.lightColor ? 'color:#1e293b;' : '';
          const title     = sp.content.replace(/"/g, '&quot;');
          const hasRemind = remindMap && remindMap[sp.id];
          const remindDot = hasRemind ? '<span class="remind-dot" title="リマインド設定済み"></span>' : '';
          const labelText = (sp.pos === 'start' || sp.pos === 'solo')
            ? `${remindDot}${escHtml(sp.content.substring(0, 14))}${sp.content.length > 14 ? '…' : ''}`
            : '';
          // groupIds を JSON 文字列として data 属性に埋め込む（シングルクォートをエスケープ）
          const groupIdsAttr = JSON.stringify(sp.groupIds).replace(/'/g, '&#39;');
          html += `<span class="span-bar bar-${sp.pos} ${lightCls} ${highlight}" `
                + `draggable="true" `
                + `data-id="${sp.id}" data-staff="${staffName}" data-year="${currentYear}" data-month="${currentMonth}" data-day="${d.day}" `
                + `data-group-ids='${groupIdsAttr}' `
                + `ondragstart="onEntryDragStart(event)" ondragend="onEntryDragEnd(event)" `
                + `onclick="editEntry(event,'${sp.id}')" title="${title}" `
                + `style="background:${sp.color};${textColor}">`
                + `${labelText}</span>`;
        }
      } else if (dayEntries.length > 0) {
        // ===== 通常タグ =====
        for (const e of dayEntries) {
          const highlight = query && e.content.toLowerCase().includes(query) ? 'highlight' : '';
          const bgColor = e.color || '#3b82f6';
          const lightColors = ['#bfdbfe','#bbf7d0','#fef08a'];
          const textStyle = lightColors.includes(bgColor) ? 'color:#1e293b;' : '';
          const title = e.content.replace(/"/g, '&quot;');
          const hasRemind = remindMap && remindMap[e.id];
          const remindDot = hasRemind ? '<span class="remind-dot" title="リマインド設定済み"></span>' : '';
          // 通常タグはグループ=自分1件だけ
          const soloGroupIds = JSON.stringify([{ id: e.id, day: d.day }]).replace(/'/g, '&#39;');
          html += `<span class="entry-tag ${highlight}" `
                + `draggable="true" `
                + `data-id="${e.id}" data-staff="${staffName}" data-year="${currentYear}" data-month="${currentMonth}" data-day="${d.day}" `
                + `data-group-ids='${soloGroupIds}' `
                + `ondragstart="onEntryDragStart(event)" ondragend="onEntryDragEnd(event)" `
                + `onclick="editEntry(event,'${e.id}')" title="${title}" `
                + `style="background:${bgColor};${textStyle}">`
                + `${remindDot}${escHtml(e.content.substring(0,20))}${e.content.length>20?'…':''}</span>`;
        }
      } else {
        html += `<div class="add-btn-cell">＋</div>`;
      }
      html += '</td>';
    }
    html += '</tr>';
  }
  html += '</tbody></table>';

  document.getElementById('scheduleTable').innerHTML = html;
  document.getElementById('entryCount').textContent = `${schedules.length} 件の予定`;

  // フィルター状態を再適用
  applyColumnFilter();
}

// ===================================================
// ===== ドラッグ＆ドロップ ハンドラー =====
// ===================================================
function onEntryDragStart(event) {
  const el = event.currentTarget;
  const draggedDay = parseInt(el.dataset.day);

  // data-group-ids からグループ全件を取得
  let groupIds = [];
  try {
    groupIds = JSON.parse(el.dataset.groupIds || '[]');
  } catch(e) {
    groupIds = [{ id: el.dataset.id, day: draggedDay }];
  }

  // ドラッグした日 (draggedDay) がグループ先頭からの何日目か（オフセット）
  const groupDays  = groupIds.map(g => g.day).sort((a,b) => a - b);
  const startDay   = groupDays[0];
  const dragOffset = draggedDay - startDay;   // ドラッグした要素が先頭から何日後か

  dragState = {
    id:         el.dataset.id,
    staff:      el.dataset.staff,
    year:       parseInt(el.dataset.year  || currentYear),
    month:      parseInt(el.dataset.month || currentMonth),
    day:        draggedDay,
    groupIds,           // [{id, day}, ...]  グループ全件
    dragOffset,         // ドロップ先の day からオフセット計算に使う
    groupLen:   groupDays.length,
  };

  event.dataTransfer.effectAllowed = 'move';
  event.dataTransfer.setData('text/plain', dragState.id);
  setTimeout(() => el.classList.add('dragging'), 0);
}

function onEntryDragEnd(event) {
  event.currentTarget.classList.remove('dragging');
  // drop-over ハイライトをすべてクリア
  document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
  dragState = null;
}

function onCellDragOver(event) {
  if (!dragState) return;
  event.preventDefault();
  event.dataTransfer.dropEffect = 'move';
  // td 自体にハイライト（td が event.currentTarget）
  const td = event.currentTarget;
  if (!td.classList.contains('drag-over')) td.classList.add('drag-over');
}

function onCellDragLeave(event) {
  const td = event.currentTarget;
  // relatedTarget が td の子要素のときは消さない
  if (!td.contains(event.relatedTarget)) {
    td.classList.remove('drag-over');
  }
}

async function onCellDrop(event, toStaff, toDay) {
  event.preventDefault();
  const td = event.currentTarget;
  td.classList.remove('drag-over');

  if (!dragState) return;

  const { staff: fromStaff, day: fromDay, groupIds, dragOffset, groupLen } = dragState;
  dragState = null;

  // ドロップ先のグループ先頭日 = toDay - dragOffset
  const toStartDay = toDay - dragOffset;

  // 同じ位置へのドロップは無視
  if (fromStaff === toStaff && fromDay === toDay) return;

  // グループ全件を日付オフセット付きで一括更新
  // groupIds は [{id, day}, ...] で day 昇順
  const sortedGroup = [...groupIds].sort((a, b) => a.day - b.day);

  // 移動先の日付を計算（先頭からの offset = g.day - sortedGroup[0].day）
  const updates = sortedGroup.map((g, i) => ({
    id:    g.id,
    day:   toStartDay + i,   // 先頭からi日後
    staff: toStaff,
    year:  currentYear,
    month: currentMonth,
  }));

  // 日付の妥当性チェック（1〜月末）
  const { days } = scheduleData;
  const maxDay = days[days.length - 1].day;
  if (updates.some(u => u.day < 1 || u.day > maxDay)) {
    showToast('移動先が月をはみ出します', 'error');
    return;
  }

  try {
    await Promise.all(updates.map(u =>
      API.updateSchedule(u.id, { staff: u.staff, year: u.year, month: u.month, day: u.day })
    ));
    const label = groupLen > 1
      ? `${groupLen}日分を移動しました（${toStaff} ${currentMonth}/${updates[0].day}〜${currentMonth}/${updates[updates.length-1].day}）`
      : `${toStaff}（${currentMonth}/${toDay}）に移動しました`;
    showToast(label, 'success');
    await loadSchedule();
  } catch (e) {
    showToast('移動に失敗しました', 'error');
  }
}

// ===== 担当者パネル =====
function renderStaffPanel() {
  if (!scheduleData) return;
  const staff = scheduleData.staff || [];
  const colors = ['#3b82f6','#10b981','#8b5cf6','#ef4444','#f97316','#ec4899','#14b8a6','#f59e0b','#6366f1'];
  let html = '';
  for (const [i, name] of staff.entries()) {
    const color = colors[i % colors.length];
    const initials = name.substring(0,2);
    html += `<div class="staff-list-item">
      <div class="staff-avatar" style="background:${color};">${initials}</div>
      <span class="staff-label">${escHtml(name)}</span>
      <button class="del-btn" onclick="deleteStaff('${name.replace(/'/g,"\\'")}')">x</button>
    </div>`;
  }
  document.getElementById('staffList').innerHTML = html || '<div style="color:var(--text-muted);font-size:12px;">担当者なし</div>';
}

// ===== 集計パネル =====
function renderSummary() {
  if (!scheduleData) return;
  const { schedules, staff } = scheduleData;
  const countMap = {};
  for (const s of schedules) {
    countMap[s.staff] = (countMap[s.staff] || 0) + 1;
  }
  const sorted = Object.entries(countMap).sort((a,b) => b[1]-a[1]).slice(0,8);
  let html = '';
  for (const [name, cnt] of sorted) {
    const pct = Math.min(100, cnt * 5);
    html += `<div style="margin-bottom:8px;">
      <div style="display:flex;justify-content:space-between;margin-bottom:2px;">
        <span>${escHtml(name)}</span><span style="font-weight:600;">${cnt}件</span>
      </div>
      <div style="background:#e2e8f0;border-radius:4px;height:4px;overflow:hidden;">
        <div style="background:var(--primary-light);height:100%;width:${pct}%;border-radius:4px;"></div>
      </div>
    </div>`;
  }
  document.getElementById('monthSummary').innerHTML = html || '<div>予定なし</div>';
}

// ===== 月移動 =====
function changeMonth(delta) {
  currentMonth += delta;
  if (currentMonth > 12) { currentMonth = 1; currentYear++; }
  if (currentMonth < 1) { currentMonth = 12; currentYear--; }
  loadSchedule();
}

function goToday() {
  const t = new Date();
  currentYear = t.getFullYear();
  currentMonth = t.getMonth() + 1;
  loadSchedule();
}

function buildJumpDropdown() {
  const yearSel = document.getElementById('jumpYear');
  const years = new Set();
  const now = new Date();
  for (let y = 2022; y <= now.getFullYear()+2; y++) years.add(y);
  for (const m of allMonths) years.add(m.year);
  yearSel.innerHTML = '';
  for (const y of [...years].sort()) {
    yearSel.innerHTML += `<option value="${y}">${y}年</option>`;
  }
  yearSel.value = currentYear;
}

function jumpToMonth() {
  currentYear = parseInt(document.getElementById('jumpYear').value);
  currentMonth = parseInt(document.getElementById('jumpMonth').value);
  loadSchedule();
}

}

// ===== 期間モード切替 =====
function toggleRangeMode() {
  const useRange = document.getElementById('useRange').checked;
  document.getElementById('singleDateSection').style.display = useRange ? 'none' : 'flex';
  document.getElementById('rangeDateSection').style.display = useRange ? 'block' : 'none';
  document.getElementById('saveBtn').textContent = useRange ? '一括保存' : '保存';
  if (useRange) {
    // 単日モードの値を開始日・終了日に引き継ぐ
    const y = document.getElementById('formYear').value;
    const m = String(document.getElementById('formMonth').value).padStart(2,'0');
    const d = String(document.getElementById('formDay').value).padStart(2,'0');
    const dateStr = `${y}-${m}-${d}`;
    document.getElementById('formDateStart').value = dateStr;
    document.getElementById('formDateEnd').value = dateStr;
    updateRangePreview();
  }
}

function updateRangePreview() {
  const start = document.getElementById('formDateStart').value;
  const end = document.getElementById('formDateEnd').value;
  const preview = document.getElementById('rangePreview');
  if (!start || !end) { preview.textContent = ''; return; }
  const sd = new Date(start + 'T00:00:00');
  const ed = new Date(end + 'T00:00:00');
  if (ed < sd) { preview.textContent = '⚠ 終了日が開始日より前です'; preview.style.color = '#ef4444'; return; }
  const days = Math.round((ed - sd) / 86400000) + 1;
  preview.style.color = 'var(--text-muted)';
  preview.textContent = `${sd.getFullYear()}/${sd.getMonth()+1}/${sd.getDate()} 〜 ${ed.getFullYear()}/${ed.getMonth()+1}/${ed.getDate()}（${days}日間）`;
}

function closeModal() {
  document.getElementById('scheduleModal').classList.add('hidden');
}

// ===== 日付範囲を全日の {year,month,day} 配列に展開 =====
function expandDateRange(startStr, endStr) {
  const dates = [];
  const cur = new Date(startStr + 'T00:00:00');
  const end = new Date(endStr + 'T00:00:00');
  if (end < cur) return null; // エラー
  while (cur <= end) {
    dates.push({ year: cur.getFullYear(), month: cur.getMonth()+1, day: cur.getDate() });
    cur.setDate(cur.getDate() + 1);
  }
  return dates;
}

async function saveEntry() {
  const staff = document.getElementById('formStaff').value;
  const content = document.getElementById('formContent').value.trim();

  if (!content) { showToast('内容を入力してください', 'error'); return; }
  if (!staff) { showToast('担当者を選択してください', 'error'); return; }

  const useRange = document.getElementById('useRange').checked;

  const btn = document.getElementById('saveBtn');
  btn.disabled = true;

  try {
    if (editingId && !useRange) {
      // ===== 既存を単日で編集 =====
      const year  = parseInt(document.getElementById('formYear').value);
      const month = parseInt(document.getElementById('formMonth').value);
      const day   = parseInt(document.getElementById('formDay').value);
      await API.updateSchedule(editingId, { staff, year, month, day, content, color: selectedColor });
      showToast('更新しました', 'success');

    } else if (useRange) {
      // ===== 期間一括（新規 or 既存どちらも） =====
      const startStr = document.getElementById('formDateStart').value;
      const endStr   = document.getElementById('formDateEnd').value;
      if (!startStr || !endStr) { showToast('開始日・終了日を入力してください', 'error'); return; }
      const dates = expandDateRange(startStr, endStr);
      if (!dates) { showToast('終了日は開始日以降にしてください', 'error'); return; }
      if (dates.length > 90) { showToast('期間が長すぎます（最大90日）', 'error'); return; }

      btn.textContent = '処理中...';

      if (editingId) {
        // 既存1件を削除してから期間分を追加
        await API.deleteSchedule(editingId);
      }

      await Promise.all(dates.map(({ year, month, day }) =>
        API.createSchedule({ staff, year, month, day, content, color: selectedColor })
      ));

      const label = editingId ? '期間に変更しました' : '追加しました';
      showToast(`${label}（${dates.length}日分）`, 'success');

    } else {
      // ===== 単日新規追加 =====
      const year  = parseInt(document.getElementById('formYear').value);
      const month = parseInt(document.getElementById('formMonth').value);
      const day   = parseInt(document.getElementById('formDay').value);
      await API.createSchedule({ staff, year, month, day, content, color: selectedColor });
      showToast('追加しました', 'success');
    }

    closeModal();
    await loadSchedule();
  } catch (e) {
    showToast('エラーが発生しました', 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = useRange ? '一括保存' : '保存';
  }
}

async function deleteEntry() {
  if (!editingId) return;
  if (!confirm('この予定を削除しますか？')) return;
  try {
    await API.deleteSchedule(editingId);
    showToast('削除しました', 'success');
    closeModal();
    await loadSchedule();
  } catch (e) {
    showToast('削除エラー', 'error');
  }
}

// ===== カラー選択 =====
function selectColor(el) {
  document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('selected'));
  el.classList.add('selected');
  selectedColor = el.dataset.color;
}

function updateColorPicker() {
  document.querySelectorAll('.color-swatch').forEach(s => {
    s.classList.toggle('selected', s.dataset.color === selectedColor);
  });
}

// ===== 担当者管理 =====
async function addStaff() {
  const input = document.getElementById('newStaffInput');
  const name = input.value.trim();
  if (!name) return;
  try {
    await API.addStaff(name);
    input.value = '';
    showToast(`${name} を追加しました`, 'success');
    await loadSchedule();
  } catch (e) {
    showToast('追加エラー（既に存在する可能性があります）', 'error');
  }
}

async function deleteStaff(name) {
  if (!confirm(`「${name}」を担当者リストから削除しますか？\n（予定データは残ります）`)) return;
  try {
    await API.deleteStaff(name);
    showToast(`${name} を削除しました`, 'success');
    await loadSchedule();
  } catch (e) {
    showToast('削除エラー', 'error');
  }
}

// ===== 前月コピー =====
async function copyPrevMonth() {
  let prevYear = currentYear, prevMonth = currentMonth - 1;
  if (prevMonth < 1) { prevMonth = 12; prevYear--; }

  if (!confirm(`${prevYear}年${prevMonth}月の予定を今月にコピーしますか？`)) return;
  try {
    const prev = await API.getSchedule(prevYear, prevMonth);
    let count = 0;
    for (const s of prev.schedules) {
      await API.createSchedule({
        year: currentYear, month: currentMonth,
        staff: s.staff, day: s.day, content: s.content, color: s.color
      });
      count++;
    }
    showToast(`${count}件コピーしました`, 'success');
    await loadSchedule();
  } catch (e) {
    showToast('コピーエラー', 'error');
  }
}

// ===== CSVエクスポート =====
function exportCSV() {
  if (!scheduleData) return;
  const { schedules } = scheduleData;
  const rows = [['年','月','日','担当者','内容']];
  for (const s of schedules) {
    rows.push([s.year, s.month, s.day, s.staff, `"${s.content.replace(/"/g,'""')}"`]);
  }
  const csv = rows.map(r => r.join(',')).join('\n');
  const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `工事予定表_${currentYear}年${currentMonth}月.csv`;
  a.click();
}

// ===== トースト =====
function showToast(msg, type = 'success') {
  const container = document.getElementById('toastContainer');
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.textContent = msg;
  container.appendChild(el);
  setTimeout(() => el.remove(), 3000);
}

// ===== リマインド機能 =====

// 起動時・定期的にリマインドを確認してバナー表示
async function checkReminders() {
  try {
    const res = await API.getReminders();
    const reminders = res.reminders || [];

    // リマインドマップを更新（タグへの●表示用）
    remindMap = {};
    for (const r of reminders) {
      if (!r.is_past) remindMap[r.schedule_id] = true;
    }

    // 通知すべきリマインド（is_due = true: 通知期間内）
    const due = reminders.filter(r => r.is_due);
    const badge = document.getElementById('remindBadge');
    if (due.length > 0) {
      badge.textContent = due.length;
      badge.style.display = 'inline';
    } else {
      badge.style.display = 'none';
    }

    // バナー表示
    const banner = document.getElementById('remindBanner');
    const list = document.getElementById('remindBannerList');
    if (due.length > 0) {
      list.innerHTML = due.map(r => {
        const s = r.schedule;
        const daysLeft = r.days_until_event;
        const badgeCls = daysLeft === 0 ? 'today' : daysLeft <= 3 ? 'soon' : '';
        const label = daysLeft === 0 ? '本日' : daysLeft === 1 ? '明日' : `あと${daysLeft}日`;
        const noteStr = r.note ? `　${escHtml(r.note)}` : '';
        return `<div class="remind-banner-item">
          <span class="badge ${badgeCls}">${label}</span>
          <span>${escHtml(s.staff)}：${escHtml(s.content.substring(0,30))}${s.content.length>30?'…':''}　（${s.year}/${s.month}/${s.day}）${noteStr}</span>
        </div>`;
      }).join('');
      banner.style.display = 'flex';
    } else {
      banner.style.display = 'none';
    }

    renderTable(); // ●ドット再描画
  } catch(e) {}
}

// 編集モーダルのリマインドボタンから開く
function openRemindFromEdit() {
  if (!editingId) return;
  const entry = scheduleData?.schedules.find(s => s.id === editingId);
  if (!entry) return;
  closeModal();
  openRemindSetModal(entry);
}

// リマインド設定モーダルを開く
function openRemindSetModal(entry) {
  remindingScheduleId = entry.id;
  document.getElementById('remindSetTarget').innerHTML =
    `<strong>${escHtml(entry.staff)}</strong>　${entry.year}/${entry.month}/${entry.day}<br>
     <span style="color:var(--text-muted);">${escHtml(entry.content.substring(0,50))}${entry.content.length>50?'…':''}</span>`;
  document.getElementById('remindDaysBefore').value = 1;
  document.getElementById('remindNote').value = '';
  document.getElementById('remindSetModal').classList.remove('hidden');
}

function closeRemindSetModal() {
  document.getElementById('remindSetModal').classList.add('hidden');
  remindingScheduleId = null;
}

function setRemindDays(n) {
  document.getElementById('remindDaysBefore').value = n;
}

async function saveRemind() {
  if (!remindingScheduleId) return;
  const days = parseInt(document.getElementById('remindDaysBefore').value);
  const note = document.getElementById('remindNote').value.trim();
  if (isNaN(days) || days < 0) { showToast('日数を正しく入力してください', 'error'); return; }
  try {
    await API.createReminder({ schedule_id: remindingScheduleId, remind_days_before: days, note });
    showToast('リマインドを設定しました', 'success');
    closeRemindSetModal();
    await checkReminders();
  } catch(e) {
    showToast('設定エラー: ' + e.message, 'error');
  }
}

// リマインド一覧モーダル
async function openRemindListModal() {
  document.getElementById('remindListModal').classList.remove('hidden');
  await renderRemindList();
}

function closeRemindListModal() {
  document.getElementById('remindListModal').classList.add('hidden');
}

async function renderRemindList() {
  const el = document.getElementById('remindListContent');
  el.innerHTML = '<div class="loading"><div class="spinner"></div></div>';
  try {
    const res = await API.getReminders();
    const reminders = res.reminders || [];
    if (reminders.length === 0) {
      el.innerHTML = '<div style="color:var(--text-muted); font-size:13px; text-align:center; padding:20px;">リマインドは設定されていません</div>';
      return;
    }
    // 期限順ソート
    const sorted = [...reminders].sort((a,b) => a.days_until_event - b.days_until_event);
    el.innerHTML = sorted.map(r => {
      const s = r.schedule;
      const dLeft = r.days_until_event;
      const isPast = r.is_past;
      const label = isPast ? `${Math.abs(dLeft)}日前に終了` : dLeft === 0 ? '本日！' : dLeft === 1 ? '明日' : `あと${dLeft}日`;
      const labelColor = isPast ? '#94a3b8' : r.is_due ? '#dc2626' : '#d97706';
      const noteHtml = r.note ? `<div style="color:var(--text-muted); font-size:11px; margin-top:2px;">📝 ${escHtml(r.note)}</div>` : '';
      return `<div class="remind-list-item" style="${isPast ? 'opacity:0.5;' : ''}">
        <div class="ri-info">
          <div style="font-weight:600; font-size:12px;">${escHtml(s.staff)}　<span style="color:var(--text-muted); font-weight:400;">${s.year}/${s.month}/${s.day}</span></div>
          <div style="font-size:12px; color:var(--text-muted);">${escHtml(s.content.substring(0,40))}${s.content.length>40?'…':''}</div>
          <div style="font-size:11px; margin-top:2px; color:var(--text-muted);">通知：${r.remind_days_before}日前（${r.remind_date}）${noteHtml}</div>
        </div>
        <span class="ri-days" style="color:${labelColor};">${label}</span>
        <button class="ri-del" onclick="deleteRemind('${r.id}')" title="削除">🗑</button>
      </div>`;
    }).join('');
  } catch(e) {
    el.innerHTML = '<div style="color:#ef4444;">読み込みエラー</div>';
  }
}

async function deleteRemind(id) {
  if (!confirm('このリマインドを削除しますか？')) return;
  try {
    await API.deleteReminder(id);
    showToast('リマインドを削除しました', 'success');
    await renderRemindList();
    await checkReminders();
  } catch(e) {
    showToast('削除エラー', 'error');
  }
}

// ===== キーボードショートカット =====
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    closeModal();
    closeRemindListModal();
    closeRemindSetModal();
  }
  if (e.key === 'ArrowLeft' && !isModalOpen()) changeMonth(-1);
  if (e.key === 'ArrowRight' && !isModalOpen()) changeMonth(1);
});

function isModalOpen() {
  return ['scheduleModal','remindListModal','remindSetModal'].some(
    id => !document.getElementById(id).classList.contains('hidden')
  );
}

// ===== モーダル外クリックで閉じる =====
document.getElementById('scheduleModal').addEventListener('click', (e) => {
  if (e.target === document.getElementById('scheduleModal')) closeModal();
});
document.getElementById('remindListModal').addEventListener('click', (e) => {
  if (e.target === document.getElementById('remindListModal')) closeRemindListModal();
});
document.getElementById('remindSetModal').addEventListener('click', (e) => {
  if (e.target === document.getElementById('remindSetModal')) closeRemindSetModal();
});

// ===== Enterキーで担当者追加 =====
document.getElementById('newStaffInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') addStaff();
});

// ===== ユーティリティ =====
function escHtml(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

init();
